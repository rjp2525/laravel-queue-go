name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Release binaries are built with the newest patch release of the
          # current toolchain so they carry its security fixes.
          go-version: '1.27'
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o lqworker-${{ matrix.goos }}-${{ matrix.goarch }}${ext} \
            ./cmd/lqworker
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lqworker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lqworker-*
